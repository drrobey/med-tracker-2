    <!-- Load Firebase Realtime Infrastructure -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseAPI = {
            initializeApp, getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut,
            getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot
        };

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes addTopicGlow {
          0% { opacity: 0; transform: translateY(-20px); background-color: rgba(6, 182, 212, 0.4); }
          50% { background-color: rgba(6, 182, 212, 0.15); transform: translateY(0); }
          100% { opacity: 1; background-color: transparent; }
        }
        .animate-add-topic { animation: addTopicGlow 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes slideInFromRight {
          0% { opacity: 0; transform: translateX(30px) scale(0.98); }
          100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .animate-slide-in-right { animation: slideInFromRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes slideInFromLeft {
          0% { opacity: 0; transform: translateX(-30px) scale(0.98); }
          100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .animate-slide-in-left { animation: slideInFromLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeInTab {
          0% { opacity: 0; transform: translateY(12px) scale(0.99); }
          100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-fade-in-tab { animation: fadeInTab 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeInBackdrop {
          0% { opacity: 0; backdrop-filter: blur(0px); }
          100% { opacity: 1; backdrop-filter: blur(6px); }
        }
        .animate-fade-in-backdrop { animation: fadeInBackdrop 0.3s ease-out forwards; }
        
        @keyframes scaleUpModal {
          0% { opacity: 0; transform: scale(0.9) translateY(20px); }
          100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-scale-up-modal { animation: scaleUpModal 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes spinSlow {
          100% { transform: rotate(360deg); }
        }
        .animate-spin-slow { animation: spinSlow 10s linear infinite; }

        /* Medical Pulse & Floating Animations */
        @keyframes medicalPulse {
          0%, 100% { transform: scale(1); opacity: 0.85; filter: drop-shadow(0 0 8px rgba(6,182,212,0.4)); }
          50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px rgba(6,182,212,0.8)); }
        }
        .animate-medical-pulse { animation: medicalPulse 2.5s ease-in-out infinite; }

        @keyframes ecgScan {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(200%); }
        }
        .animate-ecg-scan { animation: ecgScan 3.5s linear infinite; }

        @keyframes floatSlow {
          0%, 100% { transform: translateY(0px) rotate(0deg); }
          50% { transform: translateY(-10px) rotate(2deg); }
        }
        .animate-float-slow { animation: floatSlow 6s ease-in-out infinite; }

        @keyframes highlightPulse {
          0% { background-color: rgba(6, 182, 212, 0.6); transform: scale(1.01); box-shadow: 0 0 20px rgba(6, 182, 212, 0.5); z-index: 20; }
          30% { background-color: rgba(6, 182, 212, 0.2); transform: scale(1); box-shadow: 0 0 10px rgba(6, 182, 212, 0.2); }
          100% { background-color: transparent; transform: scale(1); box-shadow: none; }
        }
        .animate-highlight-row { 
          animation: highlightPulse 2s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }

        /* Interactive Micro-Interactions */
        button:not(:disabled), .interactive-pop {
          transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease, box-shadow 0.25s ease !important;
          will-change: transform, filter;
        }
        button:not(:disabled):hover, .interactive-pop:hover {
          transform: scale(1.03) translateY(-2px) !important;
          filter: brightness(1.2) drop-shadow(0 8px 16px rgba(6, 182, 212, 0.25)) !important;
        }
        button:not(:disabled):active, .interactive-pop:active {
          transform: scale(0.97) translateY(0) !important;
          filter: brightness(0.95) !important;
        }

        /* Progress Bar Animations */
        @keyframes shimmerBar {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }
        .animate-shimmer-bar { animation: shimmerBar 2s linear infinite; }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(30, 41, 59, 0.8); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(6, 182, 212, 0.5); }
    </style>

        const INTERVALS = [2, 5, 15];

        const getProgressColor = (percent) => {
          if (percent === 0) return 'bg-transparent';
          if (percent <= 34) return 'bg-gradient-to-r from-rose-500 to-orange-500 shadow-[0_0_12px_rgba(249,115,22,0.4)]';
          if (percent <= 68) return 'bg-gradient-to-r from-orange-500 to-cyan-400 shadow-[0_0_12px_rgba(34,211,238,0.4)]';
          return 'bg-gradient-to-r from-cyan-400 to-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.5)]';
        };

        const getTargetDate = (firstLearned, reps, targetIdx) => {
          if (!firstLearned) return null;
          let baseDate = new Date(firstLearned);
          let currentTarget = new Date(baseDate);
          
          for (let i = 0; i <= targetIdx; i++) {
            const gap = i === 0 ? INTERVALS[0] : INTERVALS[i] - INTERVALS[i-1];
            if (i > 0 && reps[i-1]) {
              const repDate = typeof reps[i-1] === 'string' ? new Date(reps[i-1]) : currentTarget;
              currentTarget = new Date(repDate);
            }
            currentTarget.setDate(currentTarget.getDate() + gap);
          }
          return currentTarget;
        };

          </div>
        );

        const sanitizeModuleData = (dataObj) => {
          const sanitized = {};
          if (!dataObj) return sanitized;
          
          Object.entries(dataObj).forEach(([subject, items]) => {
            let itemsArray = Array.isArray(items) ? items : (items && typeof items === 'object' ? Object.values(items) : []);
            
            sanitized[subject] = itemsArray.map((item) => {
              const defaultReps = [false, false, false];
              let itemReps = (item && Array.isArray(item.reps)) ? [...item.reps] : [...defaultReps];
              while (itemReps.length < INTERVALS.length) itemReps.push(false);
              if (itemReps.length > INTERVALS.length) itemReps = itemReps.slice(0, INTERVALS.length);

              if (typeof item === 'string') {
                return { id: Math.random().toString(36).substr(2, 9), topic: item, firstLearned: '', reps: defaultReps };
              }
              
              if (item && typeof item === 'object') {
                return { 
                  id: item.id || Math.random().toString(36).substr(2, 9), 
                  topic: item.topic || 'Untitled', 
                  firstLearned: item.firstLearned || '', 
                  reps: itemReps 
                };
              }
              return null;
            }).filter(Boolean);
          });
          return sanitized;

            const y = e.clientY - rect.top;
            divRef.current.style.setProperty('--mouse-x', `${x}px`);
            divRef.current.style.setProperty('--mouse-y', `${y}px`);
          };

          return (
            <div
              ref={divRef}
              onMouseMove={handleMouseMove}
              onClick={onClick}
              className={`relative overflow-hidden group/spotlight ${className}`}
            >
              <div 
                className="pointer-events-none absolute -inset-px z-0 opacity-0 transition-opacity duration-500 group-hover/spotlight:opacity-100 mix-blend-screen"
                style={{
                  background: `radial-gradient(120px circle at var(--mouse-x, 0) var(--mouse-y, 0), ${spotlightColor}, transparent 100%)`
                }}
              />
              {children}
            </div>
          );
        };

        const DigitalClock = () => {
          const [time, setTime] = useState(new Date());

          useEffect(() => {
            const timer = setInterval(() => setTime(new Date()), 1000);
            return () => clearInterval(timer);
          }, []);

          const timeString = time.toLocaleTimeString('en-US', {
            hour: 'numeric',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
          });

          const [timeVals, ampm] = timeString.split(' ');

          return (
            <SpotlightCard className="flex items-center gap-4 bg-slate-900/70 border border-cyan-500/30 hover:border-cyan-400 px-6 py-3.5 rounded-2xl shadow-[0_0_25px_rgba(6,182,212,0.15)] backdrop-blur-xl transition-all duration-300 cursor-default select-none w-full max-w-sm mx-auto justify-center mb-8">
              <div className="flex items-baseline gap-2 relative z-10">
                <span className="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-teal-300 to-emerald-300 tabular-nums tracking-tight">
                  {timeVals}
                </span>
                <span className="text-lg md:text-xl font-bold text-cyan-400 uppercase tracking-widest">
                  {ampm}
                </span>
              </div>
            </SpotlightCard>
          );
        };

        const ModuleTracker = ({ module, onUpdate, onBack }) => {
          const trackerData = module.data || {};
          const [activeTab, setActiveTab] = useState(() => {
            const keys = Object.keys(trackerData);
            return keys.length > 0 ? keys[0] : null;
          });
          
          const [newTopicName, setNewTopicName] = useState('');
          const [heatmapYear, setHeatmapYear] = useState(2026);
          const [topicToDelete, setTopicToDelete] = useState(null);
          const [subjectToDelete, setSubjectToDelete] = useState(null);
          const [isAddingSubject, setIsAddingSubject] = useState(false);
          const [newSubjectName, setNewSubjectName] = useState('');
          const [addedTopicId, setAddedTopicId] = useState(null);
          
          const [agendaOffset, setAgendaOffset] = useState(0);

          const currentTabItems = Array.isArray(trackerData[activeTab]) ? trackerData[activeTab] : [];

          const heatMapData = useMemo(() => {
            const counts = {};
            Object.values(trackerData).flat().forEach(item => {
              if (item && item.firstLearned) {
                const firstDate = new Date(item.firstLearned);
                const formatFirst = `${firstDate.getFullYear()}-${String(firstDate.getMonth() + 1).padStart(2, '0')}-${String(firstDate.getDate()).padStart(2, '0')}`;
                counts[formatFirst] = (counts[formatFirst] || 0) + 1;

                (item.reps || []).forEach((repVal, idx) => {
                  if (repVal) {
                    let fmt;
                    if (typeof repVal === 'string') {
                      fmt = repVal; 
                    } else {
                      const target = getTargetDate(item.firstLearned, item.reps, idx);
                      fmt = `${target.getFullYear()}-${String(target.getMonth() + 1).padStart(2, '0')}-${String(target.getDate()).padStart(2, '0')}`;
                    }
                    counts[fmt] = (counts[fmt] || 0) + 1;
                  }
                });
              }
            });
            return counts;
          }, [trackerData]);

          const gridDays = useMemo(() => {
            const days = [];
            const startDate = new Date(heatmapYear, 0, 1);
            const endDate = new Date(heatmapYear, 11, 31);
            
            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
              const formatted = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
              days.push({
                date: new Date(d),
                formatted: formatted,
                count: heatMapData[formatted] || 0
              });
            }
            return days;
          }, [heatMapData, heatmapYear]);

          const firstDayPadding = Array(gridDays[0].date.getDay()).fill(null);

          const agendaDate = useMemo(() => {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + agendaOffset);
            return d;
          }, [agendaOffset]);

          const agendaSummary = useMemo(() => {
            let items = [];
            let overdueCount = 0;
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const fmtAgenda = `${agendaDate.getFullYear()}-${String(agendaDate.getMonth() + 1).padStart(2, '0')}-${String(agendaDate.getDate()).padStart(2, '0')}`;
            const fmtToday = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            Object.entries(trackerData).forEach(([subject, topics]) => {
              if (!Array.isArray(topics)) return;
              topics.forEach(item => {
                if (!item || !item.firstLearned) return;

                const nextRepIdx = (item.reps || []).findIndex(r => !r);
                if (nextRepIdx === -1) return; 

                const targetDate = getTargetDate(item.firstLearned, item.reps, nextRepIdx);
                const fmtTarget = `${targetDate.getFullYear()}-${String(targetDate.getMonth() + 1).padStart(2, '0')}-${String(targetDate.getDate()).padStart(2, '0')}`;

                if (fmtTarget === fmtAgenda) {
                  items.push({
                    id: item.id,
                    subject,
                    topic: item.topic,
                    repNumber: nextRepIdx + 1
                  });
                }
                
                if (fmtTarget < fmtToday) {
                  overdueCount++;
                }
              });
            });

            return { items, overdueCount };
          }, [trackerData, agendaDate]);

          const formatDate = (date) => {
            if (!date) return '';
            return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
          };

          const getUrgency = (date) => {
            if (!date) return 'none';
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const diffTime = date - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays <= 0) return 'due';
            if (diffDays <= 3) return 'soon';
            return 'future';
          };

          const getAgendaLabel = () => {
            if (agendaOffset === 0) return "Today";
            if (agendaOffset === 1) return "Tomorrow";
            if (agendaOffset === -1) return "Yesterday";
            return formatDate(agendaDate);
          };

          const handleAgendaItemClick = (subject, topicId) => {
            setActiveTab(subject);
            
            setTimeout(() => {
              const targetRow = document.getElementById(`topic-row-${topicId}`);
              if (targetRow) {
                targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetRow.classList.remove('animate-highlight-row');
                void targetRow.offsetWidth; 
                targetRow.classList.add('animate-highlight-row');
              }
            }, 150);
          };

          const handleDateChange = (id, date) => {
            const newData = { ...trackerData };
            newData[activeTab] = currentTabItems.map(item => 
              item.id === id ? { ...item, firstLearned: date } : item
            );
            onUpdate({ ...module, data: newData });
          };

          const toggleRep = (id, repIndex) => {
            const newData = { ...trackerData };
            newData[activeTab] = currentTabItems.map(item => {
              if (item.id === id) {
                const newReps = [...(item.reps || [false, false, false])];
                
                if (newReps[repIndex]) {
                  newReps[repIndex] = false;
                } else {
                  const today = new Date();
                  const localDate = new Date(today.getTime() - (today.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                  newReps[repIndex] = localDate;
                }
                
                return { ...item, reps: newReps };
              }
              return item;
            });
            onUpdate({ ...module, data: newData });
          };

          const dragItem = useRef(null);
          const dragOverItem = useRef(null);
          const [isDragging, setIsDragging] = useState(false);
          const [dragHoverIndex, setDragHoverIndex] = useState(null);

          const handleDragStart = (e, index) => {
            dragItem.current = index;
            if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => setIsDragging(true), 0);
          };

          const handleDragEnter = (e, index) => {
            e.preventDefault();
            dragOverItem.current = index;
            if (dragItem.current !== index) setDragHoverIndex(index);
          };

          const handleSort = () => {
            if (dragItem.current === null || dragOverItem.current === null) return;
            if (dragItem.current === dragOverItem.current) return;

            const currentItems = [...currentTabItems];
            const draggedItemContent = currentItems[dragItem.current];
            
            currentItems.splice(dragItem.current, 1);
            currentItems.splice(dragOverItem.current, 0, draggedItemContent);
            
            const newData = { ...trackerData, [activeTab]: currentItems };
            onUpdate({ ...module, data: newData });
          };

          const handleDragEnd = () => {
            handleSort();
            setIsDragging(false);
            setDragHoverIndex(null);
            dragItem.current = null;
            dragOverItem.current = null;
          };

          const addNewTopic = (e) => {
            e.preventDefault();
            if (!newTopicName.trim()) return;
            
            const newId = Math.random().toString(36).substr(2, 9);
            const newItem = {
              id: newId,
              topic: newTopicName,
              firstLearned: '',
              reps: [false, false, false]
            };
            
            const newData = { ...trackerData, [activeTab]: [newItem, ...currentTabItems] };
            onUpdate({ ...module, data: newData });
            setNewTopicName('');
            
            setAddedTopicId(newId);
            setTimeout(() => setAddedTopicId(null), 800);
          };

          const deleteTopic = (id) => {
            const newData = { ...trackerData };
            newData[activeTab] = currentTabItems.filter(item => item.id !== id);
            onUpdate({ ...module, data: newData });
            setTopicToDelete(null);
          };

          const handleAddSubject = () => {
            if (!newSubjectName.trim() || trackerData[newSubjectName]) return;
            const newData = { ...trackerData, [newSubjectName]: [] };
            onUpdate({ ...module, data: newData });
            setActiveTab(newSubjectName);
            setIsAddingSubject(false);
            setNewSubjectName('');
          };

          const handleDeleteSubject = (subject) => {
            const newData = { ...trackerData };
            delete newData[subject];
            onUpdate({ ...module, data: newData });
            
            if (activeTab === subject) {
              const remainingKeys = Object.keys(newData);
              setActiveTab(remainingKeys.length > 0 ? remainingKeys[0] : null);
            }
            setSubjectToDelete(null);
          };

          return (
            <div className="min-h-screen text-slate-200 font-sans p-3 sm:p-6 md:p-8 relative overflow-hidden">
              {/* Background Ambient Bio-Orbs */}
              <div className="absolute top-0 left-1/4 w-96 h-96 bg-cyan-600/15 rounded-full blur-[140px] opacity-70 pointer-events-none z-0"></div>
              <div className="absolute bottom-0 right-1/4 w-[30rem] h-[30rem] bg-emerald-600/15 rounded-full blur-[140px] opacity-60 pointer-events-none z-0"></div>

              <div className="animate-slide-in-right relative z-10 w-full max-w-7xl mx-auto">
                <header className="mb-6">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                      <div className="flex items-center gap-3 mb-2">
                          <button onClick={onBack} className="interactive-pop p-2 bg-slate-900/80 border border-slate-700/80 hover:border-cyan-500/50 rounded-xl text-slate-400 hover:text-cyan-300 transition-all shadow-sm">
                              <Icon name="ChevronLeft" size={20} />
                          </button>
                          <h1 className="text-2xl sm:text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-teal-300 to-emerald-400 flex items-center gap-3">
                            <Icon name={module.icon || "BookOpen"} className="text-cyan-400" size={32} />
                            {module.name} Repetition
                          </h1>
                      </div>
                      <p className="text-slate-400 text-xs sm:text-sm ml-11 flex items-center gap-2">
                        <Icon name="Stethoscope" size={16} className="text-cyan-400" />
                        Clinical Repetition Protocol Active
                      </p>
                    </div>
                    
                    <div className="bg-slate-900/90 backdrop-blur-md p-3 px-4 rounded-xl shadow-lg border border-slate-800 flex flex-wrap gap-3.5 items-center justify-center text-xs">
                      <div className="flex items-center gap-2">
                        <div className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse shadow-[0_0_8px_rgba(225,29,72,0.6)]"></div>
                        <span className="font-bold text-slate-300">Due</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <div className="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.4)]"></div>
                        <span className="font-bold text-slate-300">Soon (&lt;3d)</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <div className="w-2.5 h-2.5 rounded-full bg-cyan-900/60 border border-cyan-500/40"></div>
                        <span className="font-bold text-slate-300">Scheduled</span>
                      </div>
                      <div className="flex items-center gap-2 pl-2 border-l border-slate-800">
                        <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.4)]"></div>
                        <span className="font-bold text-slate-300">Done</span>
                      </div>
                    </div>
                  </div>
                </header>

                <DigitalClock />

                <main>
                  {/* Daily Agenda Bar */}
                  <SpotlightCard spotlightColor="rgba(52, 211, 153, 0.2)" className="mb-6 bg-slate-900/80 border border-emerald-500/30 rounded-2xl p-4 shadow-[0_0_20px_rgba(16,185,129,0.1)] backdrop-blur-md relative overflow-hidden flex flex-col">
                    <div className="absolute top-0 left-0 w-1 h-full bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.8)] z-10"></div>
                    
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-3 pb-3 border-b border-slate-800 gap-3 pl-2">
                      <div className="flex items-center gap-2.5">
                        <div className="bg-emerald-500/20 p-2 rounded-lg text-emerald-400 shrink-0">
                          <Icon name="Calendar" size={18} />
                        </div>
                        <div>
                          <h3 className="font-bold text-slate-200 text-base">Daily Agenda</h3>
                          {agendaOffset === 0 && agendaSummary.overdueCount > 0 && (
                            <p className="text-[11px] text-rose-400 font-semibold animate-pulse">
                              Attention: {agendaSummary.overdueCount} overdue topic(s) pending.
                            </p>
                          )}
                        </div>
                      </div>
                      
                      <div className="flex items-center gap-2 bg-slate-950/60 px-2 py-1 rounded-xl border border-slate-800 justify-between">
                        <button onClick={() => setAgendaOffset(o => o - 1)} className="interactive-pop p-1 hover:bg-emerald-950/60 rounded-lg text-slate-400 hover:text-emerald-300">
                          <Icon name="ChevronLeft" size={16}/>
                        </button>
                        <span className="text-xs font-bold w-20 text-center text-slate-200 select-none">
                          {getAgendaLabel()}
                        </span>
                        <button onClick={() => setAgendaOffset(o => o + 1)} className="interactive-pop p-1 hover:bg-emerald-950/60 rounded-lg text-slate-400 hover:text-emerald-300">
                          <Icon name="ChevronRight" size={16}/>
                        </button>
                      </div>
                    </div>

                    <div key={agendaOffset} className="max-h-48 overflow-y-auto pr-1 custom-scrollbar pl-2">
                      {agendaSummary.items.length === 0 ? (
                        <div className="text-center py-4">
                          <p className="text-slate-500 text-xs font-medium">No reviews scheduled for this date.</p>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                          {agendaSummary.items.map(item => (
                            <button 
                              key={`agenda-${item.id}`}
                              onClick={() => handleAgendaItemClick(item.subject, item.id)} 
                              className="interactive-pop text-left bg-slate-800/40 hover:bg-slate-800 border border-slate-700/60 p-2.5 rounded-xl flex flex-col justify-between group h-full"
                            >
                              <div className="mb-2">
                                <div className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider mb-0.5 flex items-center gap-1">
                                  <Icon name="BookOpen" size={12}/> {item.subject}
                                </div>
                                <div className="text-xs text-slate-200 font-medium leading-snug line-clamp-2">{item.topic}</div>
                              </div>
                              <div className="self-start bg-slate-900 px-2 py-0.5 rounded text-[10px] font-bold text-slate-400 border border-slate-700">
                                Rep #{item.repNumber}
                              </div>
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  </SpotlightCard>

                  {/* Subject Tabs Header */}
                  <div className="flex flex-wrap items-center gap-2 mb-4 border-b border-slate-800 pb-px overflow-x-auto no-scrollbar">
                    {Object.keys(trackerData).map((subject) => {
                      let tabClass = `interactive-pop px-4 py-2 text-xs sm:text-sm font-semibold rounded-t-xl transition-all border-b-2 -mb-px whitespace-nowrap group flex items-center gap-2 select-none `;
                      
                      if (activeTab === subject) {
                        tabClass += 'text-cyan-300 border-cyan-400 bg-slate-900/90 shadow-[0_-2px_15px_rgba(6,182,212,0.15)] ';
                      } else {
                        tabClass += 'text-slate-400 border-transparent hover:text-slate-200 hover:bg-slate-900/40 ';
                      }

                      return (
                        <div
                          key={subject}
                          onClick={() => setActiveTab(subject)}
                          className={tabClass}
                        >
                          {subject}
                          <div 
                            onClick={(e) => { e.stopPropagation(); setSubjectToDelete(subject); }}
                            className="opacity-0 group-hover:opacity-100 p-1 text-slate-500 hover:text-rose-400 hover:bg-rose-500/20 rounded transition-all"
                            title="Delete Subject"
                          >
                            <Icon name="Trash2" size={13} />
                          </div>
                        </div>
                      );
                    })}
                    <button 
                      onClick={() => setIsAddingSubject(true)}
                      className="interactive-pop px-3 py-2 text-slate-400 border-b-2 border-transparent hover:text-cyan-400 hover:bg-slate-900/40 rounded-t-xl transition-all -mb-px flex items-center gap-1 text-xs sm:text-sm font-semibold"
                    >
                      <Icon name="Plus" size={15} /> New Subject
                    </button>
                  </div>

                  {/* Main Subject Content Table */}
                  {activeTab && (
                    <div key={activeTab} className="animate-fade-in-tab w-full">
                      <SpotlightCard className="bg-slate-900/80 backdrop-blur-xl rounded-2xl shadow-2xl border border-slate-800 overflow-hidden">
                        <div className="p-3.5 bg-slate-950/60 border-b border-slate-800 flex flex-col sm:flex-row gap-3 items-center justify-between">
                          <form onSubmit={addNewTopic} className="flex w-full sm:w-auto gap-2">
                            <input 
                              type="text" 
                              placeholder={`Add topic to ${activeTab}...`} 
                              value={newTopicName}
                              onChange={(e) => setNewTopicName(e.target.value)}
                              className="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700/80 focus:outline-none focus:ring-2 focus:ring-cyan-500 w-full sm:w-72 text-xs sm:text-sm text-slate-200 placeholder-slate-500 transition-all"
                            />
                            <button className="interactive-pop bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-slate-950 font-bold p-2 px-3 rounded-xl transition-all shrink-0 shadow-md">
                              <Icon name="Plus" size={18} />
                            </button>
                          </form>
                          <div className="flex items-center gap-2 px-3 py-1 bg-cyan-950/50 text-cyan-300 border border-cyan-500/20 rounded-full text-xs font-bold uppercase tracking-wider">
                            <Icon name="Clock" size={13} />
                            {currentTabItems.length} Topics
                          </div>
                        </div>

                        {/* NO MIN-WIDTH / WRAPPING TABLE - FITS ALL SCREENS PERFECTLY */}
                        <div className="w-full">
                          <table className="w-full text-left border-collapse table-fixed">
                            <thead>
                              <tr className="bg-slate-950/90 text-slate-400 uppercase text-[10px] tracking-wider font-bold border-b border-slate-800">
                                <th className="px-2 py-3.5 text-center w-8"></th>
                                <th className="px-3 py-3.5">Topic Name</th>
                                <th className="px-2 py-3.5 w-32 sm:w-36 text-center">Learned On</th>
                                {INTERVALS.map((days, i) => (
                                  <th key={i} className="px-1 py-3.5 text-center w-16 sm:w-20">
                                    <span className="block opacity-60">Rep {i+1}</span>
                                    <span className="text-cyan-400">+{days}d</span>
                                  </th>
                                ))}
                                <th className="px-2 py-3.5 text-center w-10"></th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/60">
                              {currentTabItems.map((item, index) => {
                                const isDragged = isDragging && dragItem.current === index;
                                const isHovered = isDragging && dragHoverIndex === index && dragItem.current !== index;

                                let rowClass = `interactive-pop transition-all duration-200 group relative `;
                                if (addedTopicId === item.id) rowClass += 'animate-add-topic z-10 ';
                                if (!isDragging) rowClass += 'hover:bg-slate-800/40 ';
                                if (isDragged) rowClass += 'opacity-40 bg-slate-950 z-0 ';
                                else if (isHovered) rowClass += 'bg-slate-800/80 z-20 ';

                                return (
                                  <tr 
                                    key={item.id} 
                                    id={`topic-row-${item.id}`}
                                    draggable
                                    onDragStart={(e) => handleDragStart(e, index)}
                                    onDragEnter={(e) => handleDragEnter(e, index)}
                                    onDragEnd={handleDragEnd}
                                    onDragOver={(e) => e.preventDefault()}
                                    className={rowClass}
                                  >
                                    <td className="px-1 py-3 text-center cursor-grab active:cursor-grabbing">
                                       <div className="inline-flex items-center justify-center p-1 rounded text-slate-600 group-hover:text-cyan-400">
                                          <Icon name="GripVertical" size={16} />
                                       </div>
                                    </td>
                                    
                                    {/* Topic Cell with Clean Text Wrapping */}
                                    <td className="px-3 py-3 align-middle">
                                      <div className="font-bold text-slate-100 text-xs sm:text-sm md:text-base leading-snug break-words whitespace-normal">
                                        {item.topic}
                                      </div>
                                    </td>
                                    
                                    <td className="px-2 py-3 align-middle">
                                      <div className="relative">
                                        <input 
                                          type="date" 
                                          value={item.firstLearned}
                                          onChange={(e) => handleDateChange(item.id, e.target.value)}
                                          className="px-2 py-1.5 rounded-lg border border-slate-700/80 text-[11px] sm:text-xs focus:ring-1 focus:ring-cyan-400 outline-none w-full bg-slate-950 text-slate-200 [color-scheme:dark] hover:border-slate-600 transition-colors"
                                        />
                                      </div>
                                    </td>
                                    
                                    {INTERVALS.map((days, idx) => {
                                      const targetDate = getTargetDate(item.firstLearned, item.reps, idx);
                                      const completedVal = item.reps[idx];
                                      const completed = !!completedVal;
                                      
                                      const displayDate = (typeof completedVal === 'string') ? new Date(completedVal) : targetDate;
                                      const urgency = getUrgency(targetDate);
                                      
                                      let buttonClass = "";
                                      if (!item.firstLearned) {
                                        buttonClass = "opacity-20 cursor-not-allowed grayscale border-transparent";
                                      } else if (completed) {
                                        buttonClass = "bg-emerald-500/20 border-emerald-500/40 text-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.15)]";
                                      } else if (urgency === 'due') {

                            <g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)">
                                <path fill="#ffffff" d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z"/>
                                <path fill="#ffffff" opacity="0.9" d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z"/>
                                <path fill="#ffffff" opacity="0.8" d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z"/>
                                <path fill="#ffffff" opacity="0.95" d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 42.369 C -8.804 40.429 -11.514 39.239 -14.754 39.239 C -19.444 39.239 -23.494 41.939 -25.464 45.859 L -21.484 48.949 C -20.534 46.099 -17.884 43.989 -14.754 43.989 Z"/>
                            </g>
                        </svg>
                        Continue with Google
                    </button>
                </SpotlightCard>
                <Watermark />
              </div>
            );
          }

          if (activeModuleId) {
            const activeModule = modules.find(m => m.id === activeModuleId);
            if (activeModule) {
              return (
                <ModuleTracker 
                  module={activeModule} 
                  onUpdate={handleUpdateModule} 
                  onBack={() => setActiveModuleId(null)} 
                />
              );
            }
          }

          return (
            <div className="min-h-screen bg-slate-950 text-slate-200 font-sans p-4 md:p-8 relative overflow-hidden">
              {/* Background Ambient Bio-Orbs */}
              <div className="absolute top-0 left-1/4 w-[28rem] h-[28rem] bg-cyan-600/15 rounded-full blur-[140px] opacity-70 pointer-events-none z-0 animate-float-slow"></div>
              <div className="absolute bottom-0 right-1/4 w-[32rem] h-[32rem] bg-emerald-600/15 rounded-full blur-[140px] opacity-60 pointer-events-none z-0 animate-float-slow" style={{animationDelay: '-3s'}}></div>
              
              {/* ECG Wave Scanner Bar */}
              <div className="absolute top-16 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-cyan-500/30 to-transparent pointer-events-none z-0 overflow-hidden">
                <div className="w-1/3 h-full bg-cyan-400 shadow-[0_0_15px_#22d3ee] animate-ecg-scan"></div>
              </div>

              <div className="animate-slide-in-left max-w-7xl mx-auto relative z-10">
                <header className="mb-8 mt-2 flex flex-col lg:flex-row lg:items-center justify-between gap-5">
                  <div>
                    <h1 className="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-teal-300 to-emerald-400 mb-2 flex items-center gap-3">
                      <div className="p-2 bg-cyan-500/10 rounded-2xl border border-cyan-500/30 text-cyan-400 shadow-[0_0_20px_rgba(6,182,212,0.2)]">
                        <Icon name="HeartPulse" size={32} className="animate-medical-pulse" />
                      </div>
                      Medical Hub
                    </h1>
                    <div className="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 mt-1">
                      <p className="text-slate-400 text-xs sm:text-sm">Drag module cards to reorder • Tap any card to open.</p>
                      <div className="flex items-center gap-2 bg-cyan-950/40 border border-cyan-500/30 px-2.5 py-0.5 rounded-full w-max">
                        <div className="w-2 h-2 bg-emerald-400 rounded-full animate-pulse shadow-[0_0_8px_#34d399]"></div>
                        <span className="text-[10px] font-bold text-cyan-300 uppercase tracking-widest">
                          {user?.displayName ? `Synced: ${user.displayName.split(' ')[0]}` : 'Live Cloud Sync'}
                        </span>
                      </div>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 self-start lg:self-auto">
                    <button onClick={handleAddPresetGit} className="interactive-pop flex items-center gap-1.5 px-3 py-2 bg-cyan-950/60 border border-cyan-500/40 hover:bg-cyan-900/60 rounded-xl text-xs font-bold text-cyan-300 shadow-sm">
                      <Icon name="Plus" size={15} /> Add GIT Module (95 Lecs)
                    </button>
                    <button onClick={handleExportData} className="interactive-pop flex items-center gap-1.5 px-3 py-2 bg-slate-900/90 border border-slate-700 hover:border-cyan-500/40 rounded-xl text-xs font-bold text-slate-300">
                      <Icon name="Upload" size={15} /> Export
                    </button>
                    <button onClick={() => fileInputRef.current?.click()} className="interactive-pop flex items-center gap-1.5 px-3 py-2 bg-slate-900/90 border border-slate-700 hover:border-teal-500/40 rounded-xl text-xs font-bold text-slate-300">
                      <Icon name="Download" size={15} /> Import
                    </button>
                    <button onClick={handleLogout} className="interactive-pop flex items-center gap-1.5 px-3 py-2 bg-rose-500/10 border border-rose-500/30 hover:bg-rose-500/20 rounded-xl text-xs font-bold text-rose-400">
                      <Icon name="LogOut" size={15} /> Exit
                    </button>
                    <input type="file" accept=".json" ref={fileInputRef} onChange={handleImportData} className="hidden" />
                  </div>
                </header>

                <DigitalClock />

                {/* Module Card Drag-and-Drop Hub */}
                <main className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  {modules.map((mod, index) => {
                    const totalTopics = Object.values(mod.data || {}).flat().length;
                    const isDragged = isDraggingModule && dragModuleItem.current === index;

                    let cardClass = `interactive-pop bg-slate-900/80 backdrop-blur-xl rounded-2xl p-5 border transition-all duration-300 shadow-xl group flex flex-col cursor-pointer min-h-[200px] relative `;
                    if (isDragged) cardClass += 'opacity-40 bg-slate-950 border-dashed border-cyan-500 z-0 ';
                    else cardClass += 'border-slate-800 hover:border-cyan-500/50 hover:shadow-[0_0_30px_rgba(6,182,212,0.2)] ';

                    return (
                      <SpotlightCard 
                        key={mod.id} 
                        draggable
                        onDragStart={(e) => handleModuleDragStart(e, index)}
                        onDragEnter={(e) => handleModuleDragEnter(e, index)}
                        onDragEnd={handleModuleDragEnd}
                        onDragOver={(e) => e.preventDefault()}
                        onClick={() => setActiveModuleId(mod.id)} 
                        className={cardClass}
                        spotlightColor="rgba(6, 182, 212, 0.25)"
                      >
                        <div className="flex justify-between items-start mb-3 relative z-10">
                          <div className="flex items-center gap-2">
                            <div className="p-1.5 rounded-lg text-slate-500 hover:text-cyan-400 cursor-grab active:cursor-grabbing transition-colors" title="Drag to reorder">
                              <Icon name="GripVertical" size={18} />
                            </div>
                            <div className="bg-gradient-to-br from-cyan-500/20 to-teal-500/20 p-2.5 rounded-xl text-cyan-400 border border-cyan-500/30">
                              <Icon name={mod.icon || "Brain"} size={24} />
                            </div>
                          </div>
                          
                          <button 
                            onClick={(e) => { e.stopPropagation(); setModuleToDelete(mod.id); }} 
                            className="p-1.5 text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg opacity-0 group-hover:opacity-100 transition-all bg-slate-800"
                            title="Delete Module"
                          >
                            <Icon name="Trash2" size={16} />
                          </button>
                        </div>

                        <h3 className="text-xl font-bold text-slate-100 mb-1 relative z-10 group-hover:text-cyan-300 transition-colors">
                          {mod.name}
                        </h3>
                        
                        <p className="text-slate-400 font-medium text-xs mb-6 flex items-center gap-1.5 relative z-10">
                          <Icon name="BookOpen" size={14} className="text-cyan-400" /> 
                          {totalTopics} {totalTopics === 1 ? 'Topic' : 'Topics'} Mastered
                        </p>

                        <div className="mt-auto flex items-center justify-between text-xs font-bold text-cyan-400 group-hover:text-cyan-300 transition-colors relative z-10 pt-3 border-t border-slate-800">
                          <span className="uppercase tracking-wider text-[10px] text-slate-400 group-hover:text-cyan-300">
                            Open Protocol
                          </span>
                          <Icon name="ChevronRight" size={16} />
                        </div>
                      </SpotlightCard>
                    );
                  })}

                  <SpotlightCard 
                    onClick={() => setIsCreatingModule(true)} 
                    className="interactive-pop bg-slate-900/40 backdrop-blur-xl rounded-2xl p-5 border-2 border-dashed border-slate-800 hover:border-cyan-400/60 transition-all hover:bg-slate-800/40 flex flex-col items-center justify-center min-h-[200px] group cursor-pointer"
                    spotlightColor="rgba(6, 182, 212, 0.2)"
                  >
                    <div className="relative z-10 flex flex-col items-center justify-center text-center">
                      <div className="bg-slate-800/80 p-3.5 rounded-2xl text-slate-400 group-hover:text-cyan-300 transition-all mb-2">
                        <Icon name="FolderPlus" size={28} />
                      </div>
                      <h3 className="text-sm font-bold text-slate-300 group-hover:text-cyan-300 transition-colors">Create Blank Module</h3>
                      <p className="text-[10px] text-slate-500 mt-0.5">Add custom medical subject tracker</p>
                    </div>
                  </SpotlightCard>
                </main>
              </div>

              {isCreatingModule && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fade-in-backdrop">
                  <div className="bg-slate-900 border border-slate-700/80 rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-scale-up-modal">
                    <h3 className="text-lg font-bold text-slate-100 mb-3 flex items-center gap-2">
                      <Icon name="FolderPlus" className="text-cyan-400" size={20} />
                      Create Custom Module
                    </h3>
                    <input autoFocus type="text" value={newModuleName} onChange={e => setNewModuleName(e.target.value)} placeholder="e.g., Cardiology, Renal..." className="w-full px-3.5 py-2 mb-5 rounded-xl bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:ring-1 focus:ring-cyan-500 text-xs" />
                    <div className="flex gap-3 justify-end">
                      <button onClick={() => setIsCreatingModule(false)} className="interactive-pop px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800">Cancel</button>
                      <button onClick={handleCreateModule} className="interactive-pop px-4 py-2 rounded-xl text-xs font-semibold bg-cyan-600/20 text-cyan-300 border border-cyan-500/50 hover:bg-cyan-600/40">Create</button>
                    </div>
                  </div>
                </div>
              )}

              {moduleToDelete && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fade-in-backdrop">
                  <div className="bg-slate-900 border border-slate-700/80 rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-scale-up-modal">
                    <h3 className="text-lg font-bold text-rose-400 mb-2">Delete Module?</h3>
                    <p className="text-slate-400 text-xs mb-5">Are you sure you want to delete this module? All repetition data inside will be removed.</p>
                    <div className="flex gap-3 justify-end">
                      <button onClick={() => setModuleToDelete(null)} className="interactive-pop px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800">Cancel</button>
                      <button onClick={() => handleDeleteModule(moduleToDelete)} className="interactive-pop px-4 py-2 rounded-xl text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/50 hover:bg-rose-500/30">Delete</button>
                    </div>
                  </div>
                </div>
              )}

              <Watermark />
            </div>
          )
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
